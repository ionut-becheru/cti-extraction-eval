# Multilingual cyber-relevance lexicon used by the pre-translation filter.
#
# Layout: per-language ISO-639-1 keys, lists of native cybersecurity terms.
# Each term is matched as a case-insensitive whole word against the original
# (un-translated) cleaned text, after stripping diacritics for languages
# where readers commonly drop them.
#
# Goal: catch enough native cyber vocabulary that a non-English forum post
# discussing security (whose only signal is in its source language) passes
# the pre-translation filter, while NOT triggering on Russian political
# ranting, K-pop forums, Catalan navigation chrome, etc.
#
# Universal patterns (CVE/CWE/IP/hash/.onion/wallets) and English-loanword
# cyber terms (malware, ransomware, exploit, RDP, ...) are handled
# separately in code (UNIVERSAL_LOANWORDS in relevance_filter.py) and apply
# regardless of detected language.

# ---- Slavic ------------------------------------------------------------
ru:  # Russian — tightened: dropped bare "пароль" (login chrome), "вирус"
  # (medical/biology), "атака" (sports/military), "тор" (food), and similar
  # too-generic terms. Kept only cyber-specific compound or domain words.
  - уязвимость       # vulnerability — domain-specific
  - уязвимост        # case stems
  - кибератак        # cyberattack
  - кибербезопас     # cybersecurity
  - взломщик         # hacker (less common; politics doesn't use)
  - взлома           # hacking (genitive)
  - вредонос         # malware (root)
  - вредоносное      # malicious
  - эксплойт
  - эксплойта
  - фишинг
  - бэкдор
